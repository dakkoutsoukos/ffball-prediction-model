[project]
name = "ffui"
version = "0.1.0"
description = "Local Streamlit UI for the FFball prediction, valuation and decision system"
requires-python = ">=3.13,<3.14"
dependencies = [
    "streamlit==1.65.0",
    "pandas==3.0.3",
    "pyarrow==25.0.1",
    "altair==6.3.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
