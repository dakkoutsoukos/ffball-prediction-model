# FROZEN - Milestone 3 rule challengers. Generated by write_m3_registry(); do not edit.
# A changed rule must be registered under a NEW id with its own prospective record.
lineage: M3
frozen_parent_commit: 7573bdfde4a1fd57359d0354947ce86ca2df914b
frozen_at_utc: '2026-10-06T00:24:36Z'
selection_rationale: Pre-registered narrow hypotheses (experiment log E6). Base =
  calibrated ESPN with the same family and weekly refit procedure as frozen m2_espn_cal.
  Thresholds = development (2020-2023) deciles/quintiles of xfp_trend among ESPN-projected
  WRs; magnitudes = half the development mean residual of the group (shrunk for winner's
  curse). No parameter is learned at run time.
data:
  history_start_season: 2017.0
  min_train_season: 2018.0
  population: pop_espn
  scoring: espn_ppr
  feature_windows:
  - 3.0
  - 8.0
  feature_engine: add_m2_features + add_absence_features
training_procedure: 'Expanding window: the calibrated-ESPN base is refit before each
  target week on every eligible row from final games strictly before it; the fixed
  adjustment is added at prediction time.'
models:
  m3_role_adjust_v1:
    type: adjusted
    calibration: components_recency
    features:
    - espn_proj
    - espn_proj_receptions
    - espn_proj_targets
    - espn_proj_receiving_yards
    - espn_proj_receiving_tds
    - espn_proj_rushing_yards
    role_rule:
      metric: xfp_trend
      hi: 1.42
      lo: -1.65
      adj_hi: -0.3
      adj_lo: 0.25
    hypothesis: 'A: ESPN over-reacts to sharp recent role changes (primary)'
  m3_role_adjust_q20_v1:
    type: adjusted
    calibration: components_recency
    features:
    - espn_proj
    - espn_proj_receptions
    - espn_proj_targets
    - espn_proj_receiving_yards
    - espn_proj_receiving_tds
    - espn_proj_rushing_yards
    role_rule:
      metric: xfp_trend
      hi: 0.8
      lo: -1.11
      adj_hi: -0.27
      adj_lo: 0.16
    hypothesis: 'A sensitivity: quintile thresholds'
  m3_return_adjust_v1:
    type: adjusted
    calibration: components_recency
    features:
    - espn_proj
    - espn_proj_receptions
    - espn_proj_targets
    - espn_proj_receiving_yards
    - espn_proj_receiving_tds
    - espn_proj_rushing_yards
    return_rule:
      adj_one: -0.2
      adj_two_plus: -0.4
    hypothesis: 'B: ESPN over-projects WRs returning from missed games'
  m3_combined_v1:
    type: adjusted
    calibration: components_recency
    features:
    - espn_proj
    - espn_proj_receptions
    - espn_proj_targets
    - espn_proj_receiving_yards
    - espn_proj_receiving_tds
    - espn_proj_rushing_yards
    role_rule:
      metric: xfp_trend
      hi: 1.42
      lo: -1.65
      adj_hi: -0.3
      adj_lo: 0.25
    return_rule:
      adj_one: -0.2
      adj_two_plus: -0.4
    hypothesis: A + B additive (pre-registered combination)
fingerprint: models/fingerprints/m3_holdout_2024_2025.csv
versioning: Any change to a rule creates a new id (e.g. *_v2) with a new prospective
  start; v1 records stay as they are.
environment:
  r_version: 4.5.1
  lockfile: renv.lock at the freeze commit

