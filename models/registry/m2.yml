selection_rationale: Pre-registered rules (research/experiment_log.md, E3) on development
  folds 2020-2023 (weekly expanding-window refits from 2018). Calibrated ESPN = best
  pooled MAE in the ESPN-only calibration family. ESPN-free challenger = lowest pooled
  MAE among nf_*. Augmentation challenger = lowest pooled MAE among aug_* with pooled
  RMSE <= calibrated ESPN.
data:
  history_start_season: 2017.0
  min_train_season: 2018.0
  population: pop_espn
  scoring: espn_ppr
  feature_windows:
  - 3.0
  - 8.0
  feature_engine: add_m2_features
  excluded_inputs: betting lines, injury reports, inactives, routes/participation,
    depth charts
training_procedure: Expanding window. Before each target week, refit on every eligible
  row (population above, season >= min_train_season, final games only) whose game_index
  is strictly less than the target week's; predict the target week.
