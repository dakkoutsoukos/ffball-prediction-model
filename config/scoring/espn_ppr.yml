# ESPN default full-PPR scoring (offensive skill players).
# Weights are applied to nflverse weekly player-stat columns (load_player_stats,
# summary_level = "week"). Points are fractional (ESPN awards 0.1 per receiving
# yard, not 1 per full 10 yards) and rounded to 2 decimals.
# Validated against ESPN's own actual weekly PPR totals - see docs/scoring.md.
name: ESPN full PPR
description: ESPN default PPR league scoring for QB/RB/WR/TE
weights:
  passing_yards: 0.04            # 1 point per 25 yards
  passing_tds: 4
  passing_interceptions: -2
  passing_2pt_conversions: 2
  rushing_yards: 0.1             # 1 point per 10 yards
  rushing_tds: 6
  rushing_2pt_conversions: 2
  receptions: 1                  # full PPR
  receiving_yards: 0.1           # 1 point per 10 yards
  receiving_tds: 6
  receiving_2pt_conversions: 2
  sack_fumbles_lost: -2          # all fumbles lost count, whatever the play type
  rushing_fumbles_lost: -2
  receiving_fumbles_lost: -2
  special_teams_tds: 6           # kick/punt return and blocked-kick TDs
  fumble_recovery_tds: 6         # offensive fumble recovered for a TD
